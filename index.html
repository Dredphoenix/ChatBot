<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span class="chat-icon">💬</span>
            <h1>DLC Chatbot</h1>
            <!-- Settings menu icon -->
            <div id="settingsButton" style="position: absolute; right: 15px; cursor: pointer; font-size: 20px;" aria-label="Settings">
                ⚙️
            </div>
        </div>
        
        <!-- Settings panel (hidden by default) -->
        <div id="settingsPanel" style="display: none; position: absolute; top: 70px; right: 10px; background: white; border-radius: 8px; box-shadow: var(--shadow-md); padding: 15px; z-index: 100; width: 250px;">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Settings</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="display: flex; align-items: center; cursor: pointer;">
                    <input type="checkbox" id="aiToggle" style="margin-right: 10px;">
                    <span>Enable AI for unknown questions</span>
                </label>
                <div style="font-size: 12px; color: #999; margin-top: 5px;">
                    When enabled, questions not in the FAQ will be sent to an AI for answers.
                </div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: flex; align-items: center; cursor: pointer;">
                    <input type="checkbox" id="historyToggle" style="margin-right: 10px;" checked>
                    <span>Save chat history</span>
                </label>
            </div>
            
            <button id="clearHistoryBtn" style="background: #f3f4f6; border: 1px solid #ddd; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%;">
                Clear Chat History
            </button>
            
            <div style="margin-top: 15px; text-align: right;">
                <button id="closeSettingsBtn" style="background: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
                    Close
                </button>
            </div>
        </div>
        <div class="chat-history" id="chatHistory">
            <div class="bot-bubble">
                Hello! I'm your digital assistant. Ask me questions about WhatsApp, Google Pay, Google Maps, and more. How can I help you today?
            </div>
            <div class="suggestions">
                <div class="suggestion-chip" onclick="handleSuggestion('How do I send a photo on WhatsApp?')">Send photos on WhatsApp</div>
                <div class="suggestion-chip" onclick="handleSuggestion('What is Google Pay?')">About Google Pay</div>
                <div class="suggestion-chip" onclick="handleSuggestion('How to use Google Maps for navigation?')">Google Maps navigation</div>
            </div>
        </div>
        <div class="chat-input-container">
            <div class="action-buttons">
                <button class="action-button" id="voiceButton" aria-label="Voice control">
                    <i>🎤</i>
                </button>
                <button class="action-button" id="attachButton" aria-label="Attach file">
                    <i>📎</i>
                </button>
            </div>
            <input type="text" class="chat-input" id="chatInput" placeholder="Type your question here..." aria-label="Message input field">
            <button class="send-button" id="sendButton" aria-label="Send message">
                <i>➤</i>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
